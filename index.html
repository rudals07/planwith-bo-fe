<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlanWith Admin Login</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="login">
    <div class="login__panel">
      <p class="login__brand">PLAN &amp; WITH</p>
      <h1 class="login__title">Admin</h1>
      <p class="login__sub">백오피스 관리자 로그인</p>

      <form id="form-login" class="login__form">
        <label>
          <span>관리자 ID</span>
          <input id="adminId" name="adminId" type="text" value="admin" autocomplete="username" />
        </label>
        <label>
          <span>비밀번호</span>
          <input id="password" name="password" type="password" value="Admin1234!" autocomplete="current-password" />
        </label>
        <p class="form-error" id="login-error"></p>
        <button type="submit" id="btn-login">로그인</button>
      </form>

      <p class="login__hint">
        BO API(<code>8081</code>) 연결 필요 · 계정: <code>admin</code> / <code>Admin1234!</code>
      </p>
    </div>
  </div>

  <script type="module" src="/login.js"></script>
</body>
</html>
